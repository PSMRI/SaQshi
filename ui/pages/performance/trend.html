<section class="sq-performance-page">
    <div class="sq-card">
            <div id="trendHeaderToolbar" class="sq-trend-toolbar sq-performance-trend-header-toolbar">
                <label class="sq-trend-department-filter">
                    <span>Indicator type</span>
                    <select id="trendTypeFilter" class="sq-form-control" aria-label="Indicator type">
                        <option value="KPI">KPI</option>
                        <option value="OUTCOME">Outcome</option>
                    </select>
                </label>
                <label class="sq-trend-department-filter" id="trendDepartmentContainer" hidden>
                    <span>Department</span>
                    <select id="trendDepartmentFilter" class="sq-form-control" aria-label="Trend Department Filter">
                        <option value="">All departments</option>
                    </select>
                </label>
                <select id="trendChartStyle" class="sq-form-control" aria-label="Trend Chart Style">
                    <option value="line">Line Trend</option>
                    <option value="area">Area Trend</option>
                    <option value="bar">Bar Trend</option>
                </select>
                <label class="sq-trend-department-filter">
                    <span>Completion month</span>
                    <input id="trendPeriodFilter" class="sq-form-control" type="month" aria-label="Outcome completion month">
                </label>
                <label class="sq-trend-toggle">
                    <input type="checkbox" id="trendAllIndicators" aria-label="Trend All Indicators">
                    <span>All indicators</span>
                </label>
                <button type="button" class="sq-btn sq-trend-icon-button sq-trend-refresh-button" id="btnTrendRefresh" aria-label="Refresh trends" title="Refresh trends"><i class="bi bi-arrow-clockwise" aria-hidden="true"></i></button>
                <button type="button" class="sq-btn sq-trend-icon-button sq-trend-excel-button" id="btnDownloadOutcomeTrend" aria-label="Download outcome Excel" title="Download outcome Excel"><i class="bi bi-file-earmark-excel" aria-hidden="true"></i></button>
                <button type="button" class="sq-btn sq-trend-icon-button sq-trend-excel-button" id="btnDownloadKpiTrend" aria-label="Download KPI Excel" title="Download KPI Excel"><i class="bi bi-file-earmark-excel" aria-hidden="true"></i></button>
            </div>
        <div class="sq-card-body">
            <div class="sq-trend-chart-grid">
                <div id="trendOutcomeSection" hidden>
                    <div class="sq-trend-section-title">
                        <h4 id="trendEffectiveTitle">Outcome Trends</h4>
                        <button type="button" id="btnOutcomePdf" class="sq-trend-pdf-button" aria-label="Download outcome trends as PDF" title="Download outcome trends as PDF"><i class="bi bi-file-earmark-pdf-fill sq-trend-pdf-file-icon" aria-hidden="true"></i><span class="sq-trend-pdf-download-badge"><i class="bi bi-download" aria-hidden="true"></i></span></button>
                    </div>
                    <div id="trendOutcomeCharts" class="sq-trend-charts"></div>
                </div>
                <div id="trendKpiSection">
                    <div class="sq-trend-section-title">
                        <h4>KPI Trends</h4>
                        <span>Month-wise result trend</span>
                    </div>
                    <div id="trendKpiCharts" class="sq-trend-charts"></div>
                </div>
            </div>
        </div>
    </div>
</section>
