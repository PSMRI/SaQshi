<section class="sq-performance-page">
    <div class="sq-performance-grid">
        <div class="sq-card">
                <div id="performanceHeaderToolbar" class="sq-performance-toolbar sq-performance-header-toolbar">
                    <label class="sq-performance-department-filter">
                        <span>Department</span>
                        <select id="perfDepartmentFilter" class="sq-form-control" aria-label="Performance Department Filter">
                            <option value="">All departments</option>
                        </select>
                    </label>
                    <select id="perfChartStyle" class="sq-form-control" aria-label="Perf Chart Style">
                        <option value="line">Line Trend</option>
                        <option value="area">Area Trend</option>
                        <option value="bar">Bar Trend</option>
                    </select>
                    <label class="sq-performance-department-filter">
                        <span>Completion month</span>
                        <input id="perfPeriodFilter" class="sq-form-control" type="month" aria-label="Outcome completion month">
                    </label>
                    <label class="sq-performance-toggle">
                        <input type="checkbox" id="perfAllIndicators" aria-label="Perf All Indicators">
                        <span>All indicators</span>
                    </label>
                    <button type="button" class="sq-btn sq-btn-light" id="btnPerformanceRefresh" title="Refresh dashboard" aria-label="Refresh dashboard"><i class="bi bi-arrow-clockwise" aria-hidden="true"></i></button>
                </div>
            <div class="sq-card-body">
                <div class="sq-performance-section-title sq-performance-months-title">
                    <h4>Month-wise entries</h4>
                    <span id="perfMonthCount">0 months</span>
                </div>
                <div id="perfMonthRows" class="sq-performance-months"></div>
                <div class="sq-performance-chart-grid">
                    <div>
                        <div class="sq-performance-section-title">
                            <h4 id="perfOutcomeTrendTitle">Outcome Indicator Trends</h4>
                            <span>Month wise result</span>
                        </div>
                        <div id="perfOutcomeCharts" class="sq-performance-charts" aria-describedby="perfOutcomeChartSummary"></div>
                        <div id="perfOutcomeChartSummary" class="sq-sr-only">Outcome indicator trend summary will appear after data loads.</div>
                    </div>
                    <div>
                        <div class="sq-performance-section-title">
                            <h4>KPI Indicator Trends</h4>
                            <span>Month wise result</span>
                        </div>
                        <div id="perfKpiCharts" class="sq-performance-charts" aria-describedby="perfKpiChartSummary"></div>
                        <div id="perfKpiChartSummary" class="sq-sr-only">KPI indicator trend summary will appear after data loads.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
