<section class="sq-login-page">

    <div class="sq-login-container">

        <!-- Left Side -->

        <div class="sq-login-brand">

            <img
                src="/ui/assets/images/logo.png"
                alt="SaQshi Logo"
                class="sq-login-logo">

            <h1>

                SaQshi

            </h1>

            <p>

                Digital Healthcare Quality Assessment Platform

            </p>

            <ul class="sq-login-features">

                <li>
                    <i class="bi bi-check-circle-fill"></i>
                    NQAS Assessment
                </li>

                <li>
                    <i class="bi bi-check-circle-fill"></i>
                    MusQan Assessment
                </li>

                <li>
                    <i class="bi bi-check-circle-fill"></i>
                    LaQshya Assessment
                </li>

                <li>
                    <i class="bi bi-check-circle-fill"></i>
                    Real-time Dashboards
                </li>

                <li>
                    <i class="bi bi-check-circle-fill"></i>
                    AI Assisted Quality Improvement
                </li>

            </ul>

        </div>

        <!-- Right Side -->

        <div class="sq-login-card">

            <div class="sq-card">

                <div class="sq-card-header">

                    <h2>

                        Welcome Back

                    </h2>

                    <p>

                        Sign in to continue

                    </p>

                </div>

                <div class="sq-card-body">

                    <form
                        id="loginForm"
                        autocomplete="off">

                        <div class="sq-form-group">

                            <label
                                for="username">

                                Username

                            </label>

                            <input
                                id="username"
                                name="username"
                                type="text"
                                class="sq-form-control"
                                placeholder="Enter username"
                                required>

                        </div>

                        <div class="sq-form-group">

                            <label
                                for="password">

                                Password

                            </label>

                            <div class="sq-password-group">

                                <input
                                    id="password"
                                    name="password"
                                    type="password"
                                    class="sq-form-control"
                                    placeholder="Enter password"
                                    required>

                                <button
                                    type="button"
                                    class="sq-password-toggle"
                                    id="togglePassword">

                                    <i class="bi bi-eye"></i>

                                </button>

                            </div>

                        </div>

                        <div class="sq-login-options">

                            <label class="sq-checkbox">

                                <input
                                    type="checkbox"
                                    id="rememberMe">

                                <span>

                                    Remember Me

                                </span>

                            </label>

                            <a
                                href="#"
                                id="forgotPasswordLink">

                                Forgot Password?

                            </a>

                        </div>

                        <button
                            type="submit"
                            class="sq-btn sq-btn-primary sq-btn-block"
                            id="loginButton">

                            <i class="bi bi-box-arrow-in-right"></i>

                            Login

                        </button>

                    </form>

                </div>

                <div class="sq-card-footer">

                    <small>

                        Version 1.0.0

                    </small>

                </div>

            </div>

        </div>

    </div>

</section>
