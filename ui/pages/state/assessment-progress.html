<!-- SaQshi Open Source | State Assessment Progress | assessment-progress.html | Version 1.0.0 -->
<section class="sq-state-page sq-assessment-progress-page">
    <div class="sq-state-toolbar">
        <div class="sq-state-filters">
            <select class="sq-form-control" id="stateAssessDivision" aria-label="Division filter"><option value="">All divisions</option></select>
            <select class="sq-form-control" id="stateAssessDistrict" aria-label="District filter" disabled><option value="">All districts</option></select>
            <select class="sq-form-control" id="stateAssessBlock" aria-label="Block filter" disabled><option value="">All blocks</option></select>
            <input type="search" class="sq-form-control" id="stateAssessSearch" placeholder="Search facility or NIN" aria-label="Search Facility Or NIN" data-domain-placeholder="Search {facility} or {facility_code}" data-domain-aria-label="Search {facility} or {facility_code}">
            <button class="sq-btn sq-btn-light sq-assess-icon-action" id="stateAssessExport" type="button" title="Download assessment records" aria-label="Download assessment records"><i class="bi bi-download"></i></button>
            <button class="sq-btn sq-btn-primary sq-assess-icon-action" id="stateAssessRefresh" type="button" title="Refresh assessment data" aria-label="Refresh assessment data"><i class="bi bi-arrow-clockwise"></i></button>
        </div>
    </div>
    <div class="sq-state-kpis" id="stateAssessSummary"></div>
    <div class="sq-assessment-completion-grid">
        <section class="sq-card sq-assessment-distribution">
            <div class="sq-card-header"><h3 id="stateAssessDistributionTitle">Division-wise assessment completion</h3><label>View progress by <select class="sq-form-control" id="stateAssessViewBy" aria-label="View progress by"><option value="AUTO">Automatic</option><option value="DIVISION">Division</option><option value="DISTRICT">District</option><option value="BLOCK">Block</option></select></label></div>
            <div class="sq-card-body" id="stateAssessDistribution"></div>
        </section>
        <section class="sq-card sq-assessment-state-heat-card">
            <div class="sq-card-header"><div><h3 id="stateAssessMapTitle">State assessment heat map</h3><small id="stateAssessMapSubtitle">District colours show completed-assessment percentage.</small></div></div>
            <div class="sq-card-body"><div id="stateAssessDistrictMap" class="sq-assessment-state-heat-map" aria-label="State district assessment heat map"></div><div class="sq-assessment-map-legend"><span><i class="is-low"></i>Below 40%</span><span><i class="is-watch"></i>40–69%</span><span><i class="is-good"></i>70% and above</span><span><i class="is-unmapped"></i>Not matched</span></div></div>
        </section>
    </div>
    <div class="sq-card">
        <div class="sq-card-header">
            <h3>Facility Assessment Records</h3>
            <input type="search" class="sq-form-control" id="stateAssessRecordSearch" placeholder="Search NIN, facility, division, district or block" aria-label="Search facility assessment records">
            <div id="stateAssessPager"></div>
        </div>
        <div class="sq-card-body" id="stateAssessRows"></div>
    </div>
</section>
<script src="/ui/pages/state/assessment-progress.js?v=20261020-no-assessment-label-23"></script>
