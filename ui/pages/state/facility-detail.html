<!-- SaQshi Open Source | State Facility Drill-down | facility-detail.html | Version 1.1.0 -->
<section class="sq-state-page sq-state-facility-detail-page">
    <div class="sq-state-toolbar">
        <div class="sq-state-filters">
            <input class="sq-form-control" id="stateFacilitySearch" type="search" placeholder="Search facility, NIN, district or block" aria-label="Search Facility, NIN, District Or Block" data-domain-placeholder="Search {facility}, {facility_code}, district or block" data-domain-aria-label="Search {facility}, {facility_code}, district or block">
            <button class="sq-btn sq-btn-primary sq-facility-detail-icon-action" id="stateFacilityLoad" type="button" title="Search facilities" aria-label="Search facilities"><i class="bi bi-search"></i></button>
        </div>
    </div>

    <div class="sq-state-grid">
        <div class="sq-card">
            <div class="sq-card-header">
                <h3 data-domain-label="facility_hierarchy">Facility Hierarchy</h3>
                <span id="stateFacilityTreeCount" class="sq-state-badge">Loading schools...</span>
            </div>
            <div class="sq-card-body" id="stateFacilityTree"></div>
        </div>

        <div class="sq-card">
            <div class="sq-card-header">
                <h3 data-domain-label="facility_details">Facility Details</h3>
                <span id="stateFacilitySelected" class="sq-state-badge" data-domain-template="Select {facility}">Select facility</span>
            </div>
            <div class="sq-card-body">
                <div id="stateFacilityInfo"></div>
                <div id="stateFacilitySummary" class="sq-state-kpis"></div>
                <div id="stateFacilityAssessments"></div>
                <div class="sq-cert-facility-types">
                    <h3>Area of Concern-wise Report</h3>
                    <div id="stateFacilityAreas"></div>
                </div>
                <div class="sq-cert-facility-types">
                    <h3>Standard-wise Report</h3>
                    <div id="stateFacilityStandards"></div>
                </div>
            </div>
        </div>
    </div>
</section>
