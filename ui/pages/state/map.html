<!-- SaQshi Open Source | State Certification Map | map.html | Version 1.1.0 -->
<section class="sq-state-page sq-state-map-page">
    <div class="sq-state-toolbar">
        <div class="sq-state-filters">
            <a class="sq-btn sq-state-analysis-guide-button sq-map-icon-action" href="/ui/help/state-facility-insights-map.html" target="_blank" rel="noopener" title="How to use this map" aria-label="How to use this map"><i class="bi bi-map"></i></a>
            <select class="sq-form-control" id="stateMapMode" aria-label="Map display mode"><option value="presence">Facility presence</option><option value="certification">Certification</option><option value="area_of_concern">Area of Concern</option></select>
            <select class="sq-form-control" id="stateMapArea" aria-label="Area of Concern" hidden disabled><option value="">Select Area of Concern</option></select>
            <select class="sq-form-control" id="stateMapSubtype" aria-label="Area of Concern subtype" hidden disabled><option value="">All subtypes</option></select>
            <input type="search" class="sq-form-control" id="stateMapSearch" placeholder="Search facility or NIN" aria-label="Search Facility Or NIN" data-domain-placeholder="Search {facility} or {facility_code}" data-domain-aria-label="Search {facility} or {facility_code}">
            <button class="sq-btn sq-btn-muted sq-map-icon-action" id="stateMapOpenFull" type="button" title="Open full map" aria-label="Open full map"><i class="bi bi-arrows-fullscreen"></i></button>
            <button class="sq-btn sq-btn-primary sq-map-icon-action" id="stateMapRefresh" type="button" title="Refresh map data" aria-label="Refresh map data"><i class="bi bi-arrow-clockwise"></i></button>
        </div>
    </div>

    <div class="sq-card" id="stateMapViewCard">
        <div class="sq-card-body">
            <p id="stateMapSummary" class="sq-help-text" aria-live="polite">Map data summary will appear after loading.</p>
            <div class="sq-state-map-wrap">
                <div id="stateMapCanvas" class="sq-state-map" role="img" aria-label="State map showing facilities by location and selected monitoring view" aria-describedby="stateMapSummary"></div>
                <div id="stateMapLoading" class="sq-state-map-loading" role="status" aria-live="polite" hidden><span class="sq-state-map-spinner" aria-hidden="true"></span><strong>Loading and plotting map…</strong><small>Please wait.</small></div>
            </div>
            <div id="stateMapLegend" class="sq-state-map-legend" hidden></div>
        </div>
    </div>

</section>
