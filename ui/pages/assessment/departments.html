<section class="sq-assessment-departments-page">

    <!-- Assessment Status -->

    <div class="sq-card sq-mb-4">

        <div class="sq-card-header">

            <div>
                <h2 class="sq-card-title">
                    Assessment Departments
                </h2>

                <p class="sq-card-subtitle">
                    Activate departments for this assessment and start checklist entry.
                </p>
            </div>

            <div class="sq-page-actions">

                <button
                    type="button"
                    class="sq-btn sq-btn-light"
                    id="btnBackToCreateAssessment">

                    <i class="bi bi-arrow-left"></i>
                    Back

                </button>

                <button
                    type="button"
                    class="sq-btn sq-btn-primary"
                    id="btnRefreshDepartments">

                    <i class="bi bi-arrow-clockwise"></i>
                    Refresh

                </button>

            </div>

        </div>

        <div class="sq-card-body">

            <div
                id="assessmentSummary"
                class="sq-assessment-summary">

                <div class="sq-empty-message">
                    Loading assessment details...
                </div>

            </div>

        </div>

    </div>

    <!-- Department List -->

    <div class="sq-card">

        <div class="sq-card-header">

            <div>
                <h2 class="sq-card-title">
                    Department Activation
                </h2>

                <p class="sq-card-subtitle">
                    Enable only applicable departments for the facility.
                </p>
            </div>

        </div>

        <div class="sq-card-body">

            <div
                id="departmentList"
                class="sq-department-grid">

                <div class="sq-empty-message">
                    Loading departments...
                </div>

            </div>

        </div>

    </div>

</section>
