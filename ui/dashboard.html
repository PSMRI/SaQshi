<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Dashboard | SaQshi</title>

    <link rel="manifest" href="/ui/manifest.webmanifest">

    <link rel="stylesheet" href="/ui/assets/css/sq-ui.css">

    <link
        rel="stylesheet"
        href="/ui/assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
</head>

<body class="sq-app">

    <div id="sq-root"></div>

    <!-- Core JS -->
    <script src="/ui/assets/dist/saqshi-app.min.js"></script>

    <!-- Page Bootstrap -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            if (window.SQ && SQ.router) {
                const user =
                    SQ.auth && SQ.auth.getUser
                        ? SQ.auth.getUser()
                        : null;
                const requestedRoute = SQ.router.currentRouteFromUrl
                    ? SQ.router.currentRouteFromUrl()
                    : "dashboard";
                const monitoringRoles = [4, 5, 8, 9];
                const isManagementRole = Number(user && user.role_id) === 11;
                const isAssessor =
                    Number(user && user.role_id) === 10 ||
                    /assessor/i.test(String(user && user.role_name || ""));
                const route = isManagementRole
                    ? "state/users"
                    : isAssessor && requestedRoute === "dashboard"
                    ? "assessor/facilities"
                    : monitoringRoles.indexOf(Number(user && user.role_id)) !== -1 && requestedRoute === "dashboard"
                    ? "state/dashboard"
                    : requestedRoute;

                SQ.router.navigate(
                    route,
                    {},
                    {
                        history: false
                    }
                );
            }
        });
    </script>

</body>

</html>
