openapi: 3.0.3

info:
  title: SaQshi Assessment, Facility & Certification APIs
  version: 1.0.0
  description: |
    Open APIs for the SaQshi platform.

    Covers:
    - Assessment master & response APIs
    - Facility master hierarchy & CRUD APIs
    - Certification master, analytics & public verification APIs

    Key Principles:
    - Certification expiry is rule-based (not stored):
        * Certified   → 3 years
        * Conditional → 1 year
    - Supports latest and historical dashboard views
    - Designed for interoperability and Digital Public Goods (DPG)
  contact:
    name: SaQshi Team
    email: support@saqshi.org

servers:
  - url: http://localhost:94/api
    description: Local Development
  - url: https://api.saqshi.in/api
    description: Production

tags:
  - name: Get Checklist master
  - name: Assessment cycle Master
  - name: Assessment Execution
  - name: Assessment Response
  - name: Facility Master  
  - name: Certification Master
  - name: Certification Analytics
  - name: Certification Verification

paths:

  ##################################################
  # Get Checklist master
  ##################################################
  /assessment/v1/getchklist/concerns:
    get:
      tags: [Get Checklist master]
      summary: Get Areas of Concern
      parameters:
        - name: facility_type
          in: query
          required: true
          schema: { type: integer }
        - name: department_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Concern list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConcernList"

  /assessment/v1/getchklist/standards:
    get:
      tags: [Get Checklist master]
      summary: Get Sub-Standards
      parameters:
        - name: facility_type
          in: query
          required: true
          schema: { type: integer }
        - name: department_id
          in: query
          required: true
          schema: { type: integer }
        - name: concern_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Standards list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardList"

  /assessment/v1/getchklist/checklist:
    get:
      tags: [Get Checklist master]
      summary: Get Checklist Items
      parameters:
        - name: facility_type
          in: query
          required: true
          schema: { type: integer }
        - name: department_id
          in: query
          required: true
          schema: { type: integer }
        - name: concern_id
          in: query
          required: true
          schema: { type: integer }
        - name: subtype_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Checklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistResponse"
  
  ##################################################
  # Assessment cycle Master
  ##################################################
  /assessment/v1/assessment_cycle_master/create.php:
    post:
      tags: [Assessment cycle Master]
      summary: Create Assessment
      description: Create a new assessment for a facility. Only one current assessment allowed per facility.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentCreate"
      responses:
        "200":
          description: Assessment created
        "400":
          description: Invalid input

  /assessment/v1/assessment_cycle_master/get.php:
    get:
      tags: [Assessment cycle Master]
      summary: Get Assessment(s)
      parameters:
        - name: id
          in: query
          schema: { type: integer }
        - name: fac_id
          in: query
          schema: { type: integer }
        - name: current
          in: query
          schema: { type: integer, enum: [1] }
      responses:
        "200":
          description: Assessment list

  /assessment/v1/assessment_cycle_master/update.php:
    put:
      tags: [Assessment cycle Master]
      summary: Update Assessment
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentUpdate"
      responses:
        "200":
          description: Updated successfully

  /assessment/v1/assessment_cycle_master/set-current.php:
    post:
      tags: [Assessment cycle Master]
      summary: Set Current Assessment
      description: Marks the assessment as current for the facility.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assessment_id]
              properties:
                assessment_id:
                  type: integer
      responses:
        "200":
          description: Current assessment updated

  /assessment/v1/assessment_cycle_master/close.php:
    post:
      tags: [Assessment cycle Master]
      summary: Close Assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assessment_id]
              properties:
                assessment_id:
                  type: integer
      responses:
        "200":
          description: Assessment closed
  ##################################################
  # ASSESSMENT Execution
  ##################################################
    /ui/v1/assessment/start:
    get:
      tags: [Assessment Execution]
      summary: Start or Resume Assessment
      parameters:
        - name: facility_id
          in: query
          required: true
          schema: { type: integer }
        - name: department_id
          in: query
          required: true
          schema: { type: integer }
        - name: ass_period_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Resume pointer or completed flag

  /ui/v1/assessment/checkpoint:
    get:
      tags: [Assessment Execution]
      summary: Get Single Checklist Item
      parameters:
        - name: csqa_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Checklist item

  /ui/v1/assessment/save:
    post:
      tags: [Assessment Execution]
      summary: Save Checklist Response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentSave"
      responses:
        "200":
          description: Saved successfully

  /ui/v1/assessment/resume:
    get:
      tags: [Assessment Execution]
      summary: Resume Next Pending Checklist
      parameters:
        - name: facility_id
          in: query
          required: true
          schema: { type: integer }
        - name: department_id
          in: query
          required: true
          schema: { type: integer }
        - name: ass_period_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Resume pointer

  /ui/v1/assessment/progress:
    get:
      tags: [Assessment Execution]
      summary: Get Assessment Progress
      parameters:
        - name: facility_id
          in: query
          required: true
          schema: { type: integer }
        - name: ass_period_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Progress summary

  /ui/v1/assessment/subtype-progress:
    get:
      tags: [Assessment Execution]
      summary: Subtype-wise Progress
      parameters:
        - name: facility_id
          in: query
          required: true
          schema: { type: integer }
        - name: department_id
          in: query
          required: true
          schema: { type: integer }
        - name: ass_period_id
          in: query
          required: true
          schema: { type: integer }
        - name: facility_type
          in: query
          required: true
          schema: { type: integer }
        - name: concern_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Subtype progress

  /ui/v1/assessment/complete:
    post:
      tags: [Assessment Execution]
      summary: Complete Assessment
      description: Explicitly marks assessment as completed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentComplete"
      responses:
        "200":
          description: Assessment completed
  ##################################################
  # ASSESSMENT RESPONSE
  ##################################################
  /assessment/v1/assessment_response/save:
    post:
      tags: [Assessment Response]
      summary: Save Checklist Response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveRequest"
      responses:
        "200": { description: Saved }
        "400": { description: Invalid input }

  /assessment/v1/assessment_response/resume:
    get:
      tags: [Assessment Response]
      summary: Resume Assessment
      parameters:
        - name: facility_id
          in: query
          required: true
          schema: { type: integer }
        - name: assessment_period
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Resume payload }

  /assessment/v1/assessment_response/progress:
    get:
      tags: [Assessment Response]
      summary: Get Assessment Progress
      parameters:
        - name: facility_id
          in: query
          required: true
          schema: { type: integer }
        - name: assessment_period
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Progress summary }

  ##################################################
  # FACILITY MASTER – HIERARCHY
  ##################################################
  /facility/v1/masters/geomaster/states:
    get:
      tags: [Facility Master]
      summary: Get States
      responses:
        "200":
          description: State list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StateList" }

  /facility/v1/masters/geomaster/divisions:
    get:
      tags: [Facility Master]
      summary: Get Divisions by State
      parameters:
        - name: state_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Division list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DivisionList" }

  /facility/v1/masters/geomaster/districts:
    get:
      tags: [Facility Master]
      summary: Get Districts by Division
      parameters:
        - name: division_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: District list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistrictList" }

  /facility/v1/masters/geomaster/blocks:
    get:
      tags: [Facility Master]
      summary: Get Blocks by District
      parameters:
        - name: district_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Block list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockList" }

  ##################################################
  # FACILITY CRUD
  ##################################################
  /facility/v1/masters/facilities/get.php:
    get:
      tags: [Facility Master]
      summary: Get Facility / List
      parameters:
        - name: facility_id
          in: query
          schema: { type: integer }
        - name: nin_no
          in: query
          schema: { type: string }
        - name: state_id
          in: query
          schema: { type: integer }
        - name: division_id
          in: query
          schema: { type: integer }
        - name: district_id
          in: query
          schema: { type: integer }
        - name: block_id
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Facility data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FacilityResponse" }

  /facility/v1/masters/facilities/create.php:
    post:
      tags: [Facility Master]
      summary: Create Facility
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FacilityCreateRequest" }
      responses:
        "200": { description: Created }
        "409": { description: Duplicate NIN }

  /facility/v1/masters/facilities/update.php:
    put:
      tags: [Facility Master]
      summary: Update Facility
      parameters:
        - name: facility_id
          in: query
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FacilityUpdateRequest" }
      responses:
        "200": { description: Updated }

  ##################################################
  # CERTIFICATION
  ##################################################
  /certification/v1/data/create.php:
    post:
      tags: [Certification Master]
      summary: Create Certification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificationCreate" }
      responses:
        "200": { description: Created }

  /certification/v1/data/update.php:
    put:
      tags: [Certification Master]
      summary: Update Certification
      parameters:
        - name: fac_nin
          in: query
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificationUpdate" }
      responses:
        "200": { description: Updated }

  /certification/v1/data/get.php:
    get:
      tags: [Certification Master]
      summary: Get Certification Records
      parameters:
        - name: fac_nin
          in: query
          schema: { type: integer }
        - name: district_id
          in: query
          schema: { type: integer }
        - name: block_id
          in: query
          schema: { type: integer }
      responses:
        "200": { description: Records }

  /certification/v1/data/analytics.php:
    get:
      tags: [Certification Analytics]
      summary: Certification Analytics
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - district_leaderboard
              - state_leaderboard
              - cert_type_summary
        - name: mode
          in: query
          schema:
            type: string
            enum: [latest, history]
      responses:
        "200": { description: Analytics }

  /certification/v1/verification/public.php:
    get:
      tags: [Certification Verification]
      summary: Public Certification Verification
      parameters:
        - name: fac_nin
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Verification }

components:
  schemas:

    StateList:
      type: object
      properties:
        status: { type: string }
        data:
          type: array
          items:
            properties:
              state_id: { type: integer }
              state_name: { type: string }

    DivisionList:
      type: object
      properties:
        status: { type: string }
        data:
          type: array
          items:
            properties:
              division_id: { type: integer }
              division_name: { type: string }

    DistrictList:
      type: object
      properties:
        status: { type: string }
        data:
          type: array
          items:
            properties:
              district_id: { type: integer }
              district_name: { type: string }

    BlockList:
      type: object
      properties:
        status: { type: string }
        data:
          type: array
          items:
            properties:
              block_id: { type: integer }
              block_name: { type: string }

    ConcernList:
      type: object
      properties:
        status: { type: string }
        data:
          type: array
          items:
            properties:
              concern_id: { type: integer }
              concern_name: { type: string }

    StandardList:
      type: object
      properties:
        status: { type: string }
        data:
          type: array
          items:
            properties:
              subtype_id: { type: integer }
              reference: { type: string }
              title: { type: string }

    ChecklistResponse:
      type: object
      properties:
        status: { type: string }
        count: { type: integer }
        data:
          type: array
          items:
            properties:
              csqa_id: { type: integer }
              checkpoint: { type: string }

    SaveRequest:
      type: object
      required: [csqa_id, compliance, facility_id, department_id, assessment_period]
      properties:
        csqa_id: { type: integer }
        compliance: { type: integer, enum: [0, 1, 2] }
        facility_id: { type: integer }
        department_id: { type: integer }
        assessment_period: { type: integer }

    FacilityResponse:
      type: object
      properties:
        status: { type: string }
        count: { type: integer }
        data:
          oneOf:
            - type: object
            - type: array
              items: { type: object }

    FacilityCreateRequest:
      type: object
      required: [state_id, division_id, district_id, block_id, facility_type, facility_name, nin_no]
      properties:
        state_id: { type: integer }
        division_id: { type: integer }
        district_id: { type: integer }
        block_id: { type: integer }
        facility_type: { type: integer }
        facility_name: { type: string }
        nin_no: { type: string }

    FacilityUpdateRequest:
      type: object
      properties:
        facility_name: { type: string }
        facility_type: { type: integer }

    CertificationCreate:
      type: object
      required: [fac_nin, fac_name, cert_type, cert_status, date_of_ass]
      properties:
        fac_nin: { type: integer }
        fac_name: { type: string }
        cert_type: { type: string }
        cert_status:
          type: string
          enum: [Certified, Conditional, Expired]
        date_of_ass:
          type: string
          format: date
        score:
          type: number
          format: double

    CertificationUpdate:
      type: object
      properties:
        cert_status:
          type: string
          enum: [Certified, Conditional, Expired]
        date_of_ass:
          type: string
          format: date
        score:
          type: number
          format: double
    AssessmentCreate:
      type: object
      required: [ass_name, fac_id_fk, ass_period_id]
      properties:
        ass_name:
          type: string
        idst_ass_fk:
          type: integer
        fac_id_fk:
          type: integer
        ass_period_id:
          type: integer
          description: Assessment identifier (period-based)
        f_date:
          type: string
          format: date
        t_date:
          type: string
          format: date
        current_assment:
          type: integer
          enum: [0, 1]
        u_id_fk:
          type: integer

    AssessmentUpdate:
      type: object
      properties:
        ass_name:
          type: string
        f_date:
          type: string
          format: date
        t_date:
          type: string
          format: date
        current_assment:
          type: integer
          enum: [0, 1]

    AssessmentSave:
      type: object
      required:
        - facility_id
        - department_id
        - ass_period_id
        - csqa_id
        - compliance
        - user_id
      properties:
        facility_id:
          type: integer
        department_id:
          type: integer
        ass_period_id:
          type: integer
        csqa_id:
          type: integer
        compliance:
          type: integer
          enum: [0, 1, 2]
        user_id:
          type: integer

    AssessmentComplete:
      type: object
      required:
        - facility_id
        - department_id
        - ass_period_id
        - user_id
      properties:
        facility_id:
          type: integer
        department_id:
          type: integer
        ass_period_id:
          type: integer
        user_id:
          type: integer
