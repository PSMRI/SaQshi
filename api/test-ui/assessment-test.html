<!DOCTYPE html>
<html>
<head>
    <title>SaQshi Configurable Assessment Test UI</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .card { background: #fff; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        button { padding: 8px 14px; cursor: pointer; }
        select, input { padding: 8px; margin: 5px; }
        .checkpoint { border: 1px solid #ddd; padding: 10px; margin: 8px 0; }
    </style>
</head>
<body>

<h2>SaQshi Configurable Assessment Test UI</h2>

<div class="card">
    <h3>Basic Setup</h3>

    Framework:
    <input id="framework" value="sample-framework">

    Facility Type:
    <input id="facility_type" value="DH">

    Facility ID:
    <input id="fac_id" value="1">

    Assessment Period:
    <input id="ass_period" value="1">

    User ID:
    <input id="user_id" value="1">

    <br><br>
    <button onclick="loadFramework()">Load Framework</button>
    <button onclick="loadDepartments()">Load Departments</button>
</div>

<div class="card">
    <h3>Framework Output</h3>
    <pre id="frameworkOutput"></pre>
</div>

<div class="card">
    <h3>Departments</h3>
    <div id="departments"></div>
    <button onclick="saveDepartments()">Save Department Status</button>
</div>

<div class="card">
    <h3>Checklist</h3>
    Department ID:
    <input id="dept_id" value="1">
    <button onclick="loadCheckpoints()">Load Checklist</button>

    <div id="checkpoints"></div>
</div>

<script>
const API_BASE = "../";

function getValue(id) {
    return document.getElementById(id).value;
}

async function loadFramework() {
    const framework = getValue("framework");

    const res = await fetch(`${API_BASE}framework/v1/load.php?framework=${framework}`);
    const data = await res.json();

    document.getElementById("frameworkOutput").textContent =
        JSON.stringify(data, null, 2);
}

async function loadDepartments() {

    const framework = getValue("framework");
    const facilityType = getValue("facility_type");
    const facId = getValue("fac_id");
    const assPeriod = getValue("ass_period");

    const url =
        `${API_BASE}framework/v1/departments.php?framework=${framework}&facility_type=${facilityType}&fac_id=${facId}&ass_period=${assPeriod}`;

    const res = await fetch(url);

    const text = await res.text();

    console.log(text);

    alert(text);

}

async function saveDepartments() {
    const departments = [];

    document.querySelectorAll(".deptCheck").forEach(chk => {
        departments.push({
            dept_id: parseInt(chk.dataset.deptId),
            is_active: chk.checked ? 1 : 0
        });
    });

    const payload = {
        fac_id: parseInt(getValue("fac_id")),
        ass_period: parseInt(getValue("ass_period")),
        user_id: parseInt(getValue("user_id")),
        departments: departments
    };

    const res = await fetch(`${API_BASE}assessment/v1/department-status/save.php`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
    });

    const data = await res.json();
    alert(data.message);
}

async function loadCheckpoints() {
    const framework = getValue("framework");
    const facId = getValue("fac_id");
    const assPeriod = getValue("ass_period");
    const deptId = getValue("dept_id");

    const url = `${API_BASE}framework/v1/checkpoints.php?framework=${framework}&fac_id=${facId}&ass_period=${assPeriod}&dept_id=${deptId}`;

    const res = await fetch(url);
    const data = await res.json();

    const box = document.getElementById("checkpoints");
    box.innerHTML = "";

    if (!data.data || !data.data.checkpoints || data.data.checkpoints.length === 0) {
        box.innerHTML = `<p>${data.message}</p>`;
        return;
    }

    data.data.checkpoints.forEach(cp => {
        let inputHtml = "";

        if (cp.type === "radio" && cp.options) {
            cp.options.forEach(opt => {
                inputHtml += `
                    <label>
                        <input type="radio" name="cp_${cp.id}" value="${opt.value}">
                        ${opt.label}
                    </label>
                `;
            });
        } else if (cp.type === "number") {
            inputHtml = `<input type="number" name="cp_${cp.id}">`;
        } else {
            inputHtml = `<input type="text" name="cp_${cp.id}">`;
        }

        box.innerHTML += `
            <div class="checkpoint">
                <b>${cp.code || cp.id}</b><br>
                ${cp.question}<br><br>
                ${inputHtml}
                <br><br>
                Remarks:
                <input type="text" id="remarks_${cp.id}">
                <br><br>
                <button onclick="saveResponse(${cp.id})">Save Response</button>
            </div>
        `;
    });
}

async function saveResponse(checkpointId) {
    const input = document.querySelector(`[name="cp_${checkpointId}"]:checked`)
        || document.querySelector(`[name="cp_${checkpointId}"]`);

    if (!input || input.value === "") {
        alert("Please select/enter response");
        return;
    }

    const payload = {
        cycle_id: 1,
        dept_id: parseInt(getValue("dept_id")),
        framework_code: getValue("framework"),
        checkpoint_id: checkpointId,
        response_value: input.value,
        remarks: document.getElementById(`remarks_${checkpointId}`).value,
        evidence_url: "",
        user_id: parseInt(getValue("user_id"))
    };

    const res = await fetch(`${API_BASE}assessment/v1/save-response.php`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
    });

    const data = await res.json();
    alert(data.message);
}
</script>

</body>
</html>
