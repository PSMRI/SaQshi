<!DOCTYPE html>
<html lang="en">
<head>
  <!-- REQUIRED META TAGS -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SaQshi Assessment API Docs</title>

  <!-- Swagger UI CSS -->
  <link rel="stylesheet"
        href="https://unpkg.com/swagger-ui-dist/swagger-ui.css">
</head>
<body>

<div id="swagger-ui"></div>

<!-- Swagger UI JS -->
<script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>

<script>
window.onload = () => {
  SwaggerUIBundle({
    url: "../openapi.yaml",
    dom_id: "#swagger-ui",
    deepLinking: true,
    presets: [
      SwaggerUIBundle.presets.apis
    ],
    layout: "BaseLayout"
  });
};
</script>


</body>
</html>
