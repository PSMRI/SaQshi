<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaQshi Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 420px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,.1);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #0d6efd;
        }

        .subtitle {
            color: #6c757d;
            font-size: 14px;
        }

        #errorBox {
            display: none;
        }
    </style>
</head>

<body>

    <div class="card login-card">

        <div class="card-body p-4">

            <div class="text-center mb-4">
                <div class="logo">SaQshi</div>
                <div class="subtitle">
                    Self Assessment for Quality Standards in Healthcare Institutions
                </div>
            </div>

            <div id="errorBox" class="alert alert-danger"></div>

            <form id="loginForm">

                <div class="mb-3">
                    <label class="form-label">Username</label>

                    <input
                        type="text"
                        id="username"
                        class="form-control"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        required>
                </div>

                <div class="d-grid">
                    <button
                        type="submit"
                        id="btnLogin"
                        class="btn btn-primary">

                        Login
                    </button>
                </div>

            </form>

        </div>

    </div>

    <script src="assets/js/api.js"></script>

    <script>

        async function initializeLogin() {

            try {

                await SaqshiAPI.fetchCsrfToken();

            } catch (e) {

                console.error(e);

                showError(
                    "Unable to initialize application."
                );
            }
        }

        function showError(message) {

            const box = document.getElementById('errorBox');

            box.style.display = 'block';
            box.innerText = message;
        }

        function hideError() {

            const box = document.getElementById('errorBox');

            box.style.display = 'none';
            box.innerText = '';
        }

        document
            .getElementById('loginForm')
            .addEventListener('submit', async function (e) {

                e.preventDefault();

                hideError();

                const btn =
                    document.getElementById('btnLogin');

                btn.disabled = true;
                btn.innerText = 'Signing In...';

                try {

                    const response =
                        await SaqshiAPI.post(
                            '/auth/v1/login.php',
                            {
                                username:
                                    document.getElementById('username').value.trim(),

                                password:
                                    document.getElementById('password').value
                            }
                        );

                    if (
                        response.data &&
                        response.data.user
                    ) {
                        SaqshiAPI.saveUser(
                            response.data.user
                        );
                    }

                    if (
                        response.data &&
                        response.data.csrf_token
                    ) {
                        SaqshiAPI.setCsrfToken(
                            response.data.csrf_token
                        );
                    }

                    window.location.href =
                        'dashboard.html';

                } catch (error) {

                    showError(
                        error.message
                    );

                } finally {

                    btn.disabled = false;
                    btn.innerText = 'Login';
                }

            });

        initializeLogin();

    </script>

</body>

</html>
