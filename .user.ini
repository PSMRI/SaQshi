; SaQshi shared-resource upload limits.
; Used by PHP CGI/FastCGI hosts (including IIS) for this application directory.
upload_max_filesize = 500M
post_max_size = 510M
max_file_uploads = 10
max_execution_time = 600
max_input_time = 600

; Do not disclose PHP errors or version details in production responses.
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off
